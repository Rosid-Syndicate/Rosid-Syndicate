<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#011E52" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/logo-mark-192.png" />

    <!--
      Site-wide defaults. Each route overrides title/description/canonical/OG
      at runtime (src/components/Seo.tsx). Social crawlers that do not execute
      JavaScript read these static values. %VITE_SITE_URL% is substituted by
      Vite at build time from VITE_SITE_URL (default set in vite.config.ts).
    -->
    <title>Rosid Syndicates Group — Infrastructure, Finance & Trade in Nepal</title>
    <meta name="description" content="Rosid Syndicates Group is a Kathmandu-based group of five companies providing construction supply, public tender execution, bank guarantee and financial-closure advisory, and cross-border trade and logistics in Nepal — for domestic developers and foreign contractors." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rosid Syndicates Group" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Rosid Syndicates Group — Infrastructure, Finance & Trade in Nepal" />
    <meta property="og:description" content="A Kathmandu-based group of five companies: construction supply, public tender execution, bank guarantee and financial-closure advisory, and cross-border trade in Nepal." />
    <meta property="og:image" content="%VITE_SITE_URL%/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rosid Syndicates Group" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rosid Syndicates Group — Infrastructure, Finance & Trade in Nepal" />
    <meta name="twitter:description" content="A Kathmandu-based group of five companies: construction supply, public tender execution, bank guarantee and financial-closure advisory, and cross-border trade in Nepal." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/preview.png" />

    <!-- Connections used on first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://mlfakixbqzgttwzqinvl.supabase.co" />

    <!--
      Fonts: Inter 400/500/600/700/800 + Montserrat 700/800 (was Inter 400–900 +
      Montserrat 500–900). The stylesheet is attached from src/main.tsx so it
      never blocks first render (and no inline event handler is needed under
      the CSP); the system-ui fallback renders immediately (font-display: swap).
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" />
    </noscript>

    <script type="application/ld+json" data-seo="jsonld">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "%VITE_SITE_URL%/#organization",
        "name": "Rosid Syndicates Group",
        "url": "%VITE_SITE_URL%",
        "logo": "%VITE_SITE_URL%/brand/logo-square-512.png",
        "description": "A Kathmandu-based group of five companies providing construction supply, public tender execution, bank guarantee and financial-closure advisory, and cross-border trade and logistics in Nepal.",
        "email": "rosid2025@outlook.com",
        "telephone": "+977-9705398939",
        "address": { "@type": "PostalAddress", "addressLocality": "New Baneshwor, Kathmandu", "addressCountry": "NP" },
        "areaServed": { "@type": "Country", "name": "Nepal" }
      }
    </script>
  </head>
  <body class="bg-canvas text-muted antialiased">
    <div id="root"></div>
    <noscript>
      <div style="max-width:40rem;margin:4rem auto;padding:0 1.5rem;font-family:system-ui,sans-serif;color:#011E52">
        <h1>Rosid Syndicates Group</h1>
        <p>This website needs JavaScript to run. Contact us at <a href="mailto:rosid2025@outlook.com">rosid2025@outlook.com</a> or +977-9705398939.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
