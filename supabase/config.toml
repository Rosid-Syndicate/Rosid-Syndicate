# Declared hosted-project settings, applied with `npx supabase config push`.
# Only the properties listed here are managed; everything else stays as set in
# the dashboard. Preview changes first with `npx supabase config diff`.
project_id = "yemiingdtfelkfcagins"

[auth]
# Where auth emails link back to and which redirects are allowed.
site_url = "https://www.rosiddai.com"
additional_redirect_urls = [
  "https://www.rosiddai.com/admin/reset-password",
  "https://www.rosiddai.com/admin/dashboard",
  "https://rosiddai.com/admin/reset-password",
]
# Staff accounts are created by an administrator (Authentication → Users);
# public self-registration must stay off (SECURITY_AUDIT.md finding C-1).
enable_signup = false

# Turn the sign-in human check into a real gate: Supabase verifies the token
# the login page sends. Uncomment and run
#   TURNSTILE_SECRET_KEY=<secret> npx supabase config push
# (the secret is read from the environment, never stored in this file).
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(TURNSTILE_SECRET_KEY)"
