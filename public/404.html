<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found | Rosid Syndicates Group</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #F4F4F2; color: #475569; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
      main { max-width: 44rem; margin: 0 auto; padding: 22vh 1.25rem 4rem; }
      .eyebrow { display: inline-flex; align-items: center; gap: .75rem; font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: #A64F00; }
      .eyebrow::before { content: ''; width: 1.5rem; height: 1px; background: currentColor; opacity: .6; }
      h1 { margin: 1rem 0 0; font-size: clamp(2.25rem, 4.5vw, 3.5rem); line-height: 1.08; letter-spacing: -.025em; color: #011E52; }
      p { margin: 1.25rem 0 0; font-size: 1.125rem; line-height: 1.7; }
      .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2.5rem; }
      a.btn { display: inline-flex; align-items: center; min-height: 44px; padding: .75rem 1.5rem; border-radius: 2px; font-weight: 700; font-size: .875rem; text-decoration: none; }
      .primary { background: #011E52; color: #fff; } .primary:hover { background: #0A2A6B; }
      .secondary { background: #fff; color: #011E52; border: 1px solid #E2E8F0; } .secondary:hover { border-color: #011E52; }
      a:focus-visible { outline: 3px solid #FD7B00; outline-offset: 3px; }
      nav { margin-top: 3.5rem; padding-top: 2rem; border-top: 1px solid #E2E8F0; }
      nav p { margin: 0 0 1rem; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
      nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem 2rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); font-size: .9375rem; }
      nav a { color: #011E52; font-weight: 700; text-decoration: none; } nav a:hover { color: #A64F00; text-decoration: underline; text-underline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>Page not found</h1>
      <p>The page you requested does not exist or has moved.</p>
      <div class="actions">
        <a class="btn primary" href="/">Back to home</a>
        <a class="btn secondary" href="/#contact">Contact us</a>
      </div>
      <nav aria-label="Popular pages">
        <p>Popular pages</p>
        <ul>
          <li><a href="/companies">Group companies →</a></li>
          <li><a href="/infrastructure-tender-services">Foreign contractor support →</a></li>
          <li><a href="/procurement">Procurement &amp; tenders →</a></li>
          <li><a href="/blog">Insights &amp; news →</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
